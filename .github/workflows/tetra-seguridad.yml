# Check del comprobante de seguridad (plan 0001 de la plataforma, pieza 6).
#
# Lo exige un ruleset de la organización en los repos de código: no se copia a ningún repo.
# Corre con el token de la App tetra-memoria, de solo lectura, y no escribe nada. No escanea:
# verifica el comprobante que tetra pr deja en la línea «Seguridad:». Con la variable de
# organización TETRA_SEGURIDAD_MODO en «bloquea» falla ante un problema; si no, solo avisa.
# Después de editar la descripción, tetra pr lo vuelve a correr; a mano, «Re-run».
name: tetra-seguridad

on:
  pull_request:

permissions: {}

jobs:
  verificar:
    name: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Los PR de bots (Dependabot) no reciben los secretos de Actions ni corren tetra.
      - name: PR de un bot
        if: github.event.pull_request.user.type == 'Bot'
        run: echo "Lo abrió un bot, no lleva comprobante."

      - name: Token de la App tetra-memoria
        if: github.event.pull_request.user.type != 'Bot'
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.TETRA_MEMORIA_CLIENT_ID }}
          private-key: ${{ secrets.TETRA_MEMORIA_LLAVE }}
          owner: tetraimpacts
          permission-contents: read
          permission-pull-requests: read

      - name: Código del check y política de la organización
        if: github.event.pull_request.user.type != 'Bot'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          crudo='Accept: application/vnd.github.raw'
          gh api -H "$crudo" 'repos/tetraimpacts/.github/contents/tetra-seguridad/verificar.mjs' > "$RUNNER_TEMP/verificar.mjs"
          gh api -H "$crudo" 'repos/tetraimpacts/.github/contents/tetra-seguridad/politica.json' > "$RUNNER_TEMP/politica.json"

      - name: Verificar el comprobante
        if: github.event.pull_request.user.type != 'Bot'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR_NUMERO: ${{ github.event.pull_request.number }}
          TETRA_POLITICA: ${{ runner.temp }}/politica.json
          TETRA_SEGURIDAD_MODO: ${{ vars.TETRA_SEGURIDAD_MODO }}
        run: node "$RUNNER_TEMP/verificar.mjs"
